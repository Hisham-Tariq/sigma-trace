name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The suite runs TypeScript through Node's native type stripping,
          # so there is no compile step and no test framework to install.
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
